{{- if .Values.controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unified-cd-controller-kubernetes-enrollment
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unified-cd-controller-kubernetes-enrollment
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: unified-cd-controller
    namespace: {{ include "unified-cd.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: unified-cd-controller-kubernetes-enrollment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unified-cd-controller-kubernetes-enrollment
  namespace: {{ include "unified-cd.namespace" . }}
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unified-cd-controller-kubernetes-enrollment
  namespace: {{ include "unified-cd.namespace" . }}
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: unified-cd-controller
    namespace: {{ include "unified-cd.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unified-cd-controller-kubernetes-enrollment
{{- /*
The controller verifies a job Pod's projected token by reading the Pod, so it
needs pods/get in every namespace job Pods run in. Those are the namespaces of
the in-cluster kubernetesStoreCredentialPolicies in the merged controller
config. The release namespace is already covered by the Role above. Other
clusters are reached with their own credentials and are the operator's to
grant. The namespaces must exist before the install.
*/}}
{{- $config := include "unified-cd.controllerConfig" . | fromYaml }}
{{- $release := include "unified-cd.namespace" . }}
{{- $jobNamespaces := list }}
{{- range (($config.agentAuth | default dict).kubernetesStoreCredentialPolicies | default list) }}
{{- if eq (.cluster | default "") "in-cluster" }}
{{- range (.namespaces | default list) }}
{{- if ne . $release }}
{{- $jobNamespaces = append $jobNamespaces . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $ns := $jobNamespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unified-cd-controller-job-pods
  namespace: {{ $ns }}
  labels:
    {{- include "unified-cd.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unified-cd-controller-job-pods
  namespace: {{ $ns }}
  labels:
    {{- include "unified-cd.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: unified-cd-controller
    namespace: {{ $release }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unified-cd-controller-job-pods
{{- end }}
{{- end }}
