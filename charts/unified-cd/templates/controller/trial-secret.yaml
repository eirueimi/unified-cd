{{- if include "unified-cd.trialSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: unified-cd-controller
  namespace: {{ include "unified-cd.namespace" . }}
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
  annotations:
    # YAML comments do not survive rendering, so this note is an annotation.
    unified-cd.io/kek-provenance: >-
      The secret encryption key for this install is generated once, at install
      time, by the unified-cd-kek-init Job and stored in the
      unified-cd-controller-kek Secret in this namespace. It is created with
      `kubectl create`, not `apply`, specifically so that re-applying
      install.yaml or running `helm upgrade` does NOT regenerate or replace
      it — doing so would make every secret already encrypted with the old key
      permanently unreadable. That Secret, not this one, is what makes your
      registered secrets durable: back it up. A Postgres dump alone is not
      enough to restore them, since the rows it contains are ciphertext
      without the key.
type: Opaque
stringData:
  UNIFIED_DB_DSN: {{ printf "postgres://unified:unified@postgres.%s.svc.cluster.local:5432/unified?sslmode=disable" (include "unified-cd.namespace" .) | quote }}
  UNIFIED_TOKEN: "dev-token-change-me"
  {{- /*
  No fixed key is baked into the trial credentials: shipping one would put
  the key that protects every secret into a public repository. Instead,
  UNIFIED_CONTROLLER_KEY_FILE points at a Secret volume mount backed by
  controller.kek.secretName, and that Secret is populated at install time by
  the unified-cd-kek-init Job (templates/controller/kek-job.yaml) rather than
  shipped with a placeholder value. See that file for how the key is generated
  and why it survives upgrades.
  */}}
  UNIFIED_S3_ENDPOINT: {{ printf "garage.%s.svc.cluster.local:3900" (include "unified-cd.namespace" .) | quote }}
  UNIFIED_S3_BUCKET: "unified-cd-logs"
  UNIFIED_S3_KEY: "garageadmin"
  UNIFIED_S3_SECRET: "garageadmin12345"
{{- end }}
