{{- if .Values.agent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unified-cd-k8s-agent
  namespace: {{ .Values.jobNamespace.name }}
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    # update/patch are required by pod reuse (podTemplate.reuse): the pool marks
    # a finished pod idle by updating its annotations (PodManager.UpdatePodAnnotations,
    # PodPool.ReleasePod). Without update, that call is forbidden and the pool
    # falls back to deleting the pod every run — reuse silently never happens.
    verbs: ["create", "get", "list", "delete", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # Agent-owned named volumes (AgentVolume resources delivered by the
    # controller): the agent looks up and lists its PVCs on every heartbeat
    # (get, list), creates the missing ones (create), takes and releases an
    # exclusive volume by updating the claim's lock annotation (update), records
    # a volume's reclaim policy and when it left the set on its PVC (patch), and
    # deletes the PVC of a reclaimPolicy: Delete volume once it has been out of
    # the set for 10 minutes and no pod or lock holds it (delete). It deletes
    # nothing else.
    verbs: ["create", "get", "list", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unified-cd-k8s-agent
  namespace: {{ .Values.jobNamespace.name }}
  labels:
    {{- include "unified-cd.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: unified-cd-k8s-agent
    namespace: {{ include "unified-cd.namespace" . }}
roleRef:
  kind: Role
  name: unified-cd-k8s-agent
  apiGroup: rbac.authorization.k8s.io
{{- end }}
