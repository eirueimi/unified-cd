site_name: unified-cd
site_description: An open-source CI/CD tool (Jenkins alternative) written in Go.
site_url: https://eirueimi.github.io/unified-cd/
repo_url: https://github.com/eirueimi/unified-cd
repo_name: eirueimi/unified-cd
edit_uri: edit/main/docs/
copyright: Licensed under the Apache License 2.0

strict: true

exclude_docs: |
  superpowers/
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        getting-started.md: getting-started/quickstart.md
        secrets.md: user-guide/secrets.md
        agents.md: operator-manual/agents.md
        kubernetes-integration.md: operator-manual/kubernetes-integration.md
        authentication.md: operator-manual/authentication.md
        authorization.md: operator-manual/authorization.md
        high-availability.md: operator-manual/high-availability.md
        operations.md: operator-manual/operations.md
        audit.md: operator-manual/audit.md
        migration-agent-id-scoped-credentials.md: operator-manual/migrations/agent-id-scoped-credentials.md
        cli.md: reference/cli.md
        configuration.md: reference/configuration.md
        field-reference.md: reference/field-reference.md
        frontend-development.md: contributing/frontend-development.md
        jobs.md: user-guide/writing-jobs/index.md
        resources.md: user-guide/resources/index.md

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Core Concepts: getting-started/concepts.md
  - User Guide:
      - Writing Jobs:
          - Overview: user-guide/writing-jobs/index.md
          - Job Structure: user-guide/writing-jobs/job-structure.md
          - Parameters: user-guide/writing-jobs/parameters.md
          - Steps: user-guide/writing-jobs/steps.md
          - Expressions and Conditions: user-guide/writing-jobs/expressions.md
          - Artifacts and Cache: user-guide/writing-jobs/artifacts-and-cache.md
          - Templates and Reuse: user-guide/writing-jobs/templates-and-reuse.md
          - Isolation and Containers: user-guide/writing-jobs/isolation-and-containers.md
          - Concurrency and Agent Selection: user-guide/writing-jobs/concurrency-and-agent-selection.md
          - Approval and Finally: user-guide/writing-jobs/approval-and-finally.md
          - Complete Example: user-guide/writing-jobs/complete-example.md
      - Resources:
          - Overview: user-guide/resources/index.md
          - Job: user-guide/resources/job.md
          - JobTemplate: user-guide/resources/job-template.md
          - Schedule: user-guide/resources/schedule.md
          - WebhookReceiver: user-guide/resources/webhook-receiver.md
          - GitCredential: user-guide/resources/git-credential.md
          - AppSource: user-guide/resources/app-source.md
      - Variables: user-guide/variables.md
      - Secrets: user-guide/secrets.md
  - Operator Manual:
      - Agents and Routing: operator-manual/agents.md
      - Kubernetes Integration: operator-manual/kubernetes-integration.md
      - Authentication: operator-manual/authentication.md
      - Authorization: operator-manual/authorization.md
      - High Availability: operator-manual/high-availability.md
      - Operations and Backup: operator-manual/operations.md
      - Audit Log: operator-manual/audit.md
      - Migrations:
          - ID-Scoped Agent Credentials: operator-manual/migrations/agent-id-scoped-credentials.md
          - Kubernetes Secrets Out of the Bundle: operator-manual/migrations/kubernetes-secrets-out-of-the-bundle.md
          - PodTemplate Sub-Field Routing: operator-manual/migrations/podtemplate-subfield-routing.md
          - Concurrent Kubernetes Step Execution: operator-manual/migrations/k8s-concurrent-step-execution.md
          - Uses Template Step Fields: operator-manual/migrations/uses-template-step-fields.md
          - "Bounded and Failure-Honest finally:": operator-manual/migrations/finally-phase-semantics.md
          - Enforced runsIn.resources: operator-manual/migrations/runsin-resources-enforcement.md
          - "Apply-Time if: Validation": operator-manual/migrations/apply-time-if-validation.md
  - Reference:
      - CLI Reference: reference/cli.md
      - Configuration Reference: reference/configuration.md
      - Field Reference: reference/field-reference.md
      - JSON Schema and Editor Setup: reference/json-schema.md
  - Troubleshooting:
      - Symptom Index: troubleshooting/index.md
      - Runs and Scheduling: troubleshooting/runs-and-scheduling.md
      - Steps and Execution: troubleshooting/steps-and-execution.md
      - Artifacts and Storage: troubleshooting/artifacts-and-storage.md
      - Templates and uses: troubleshooting/templates-and-uses.md
      - Webhooks: troubleshooting/webhooks.md
      - Agents and Enrollment: troubleshooting/agents-and-enrollment.md
      - Controller and Database: troubleshooting/controller-and-database.md
  - Contributing:
      - Contributing: contributing/index.md
      - Frontend Development: contributing/frontend-development.md
