# Node.js dependency cache setup job template
# Reference from a job step via uses: (git://<host>/<owner>/<repo>/templates/setup-node.yaml@<ref>).
#
# Agent requirements: node, npm
#
# cache: since the step's path expands template expressions ({{ .Params.* }}),
# node_modules under working_dir can be targeted directly for caching.
#
# When referencing as a git:// template:
#   job: git://github.com/your-org/ci-templates/setup-node.yaml@v1
apiVersion: unified-cd/v1
kind: JobTemplate
metadata:
  name: setup-node
spec:
  params:
    inputs:
      - name: working_dir
        type: string
        default: "."
        description: "Directory to run package-lock.json / npm ci in"
        # working_dir must be relative to the run workspace; absolute paths are rejected.
      - name: lockfile
        type: string
        default: "package-lock.json"
        description: "Name of the lockfile used to compute the cache key"
  steps:
    # The cache key is derived from a hash of the lockfile computed here, inside
    # working_dir, rather than with the hashFile template function: hashFile is
    # not available on the Kubernetes agent (the workspace lives in the pod).
    # A missing lockfile yields the fixed hash "none".
    - name: hash_lockfile
      env:
        WORKING_DIR: "{{ .Params.working_dir }}"
        LOCKFILE: "{{ .Params.lockfile }}"
      run: |
        #!/usr/bin/env sh
        set -eu
        cd "$WORKING_DIR"
        h=none
        if [ -f "$LOCKFILE" ]; then
          if command -v sha256sum >/dev/null 2>&1; then
            h=$(sha256sum "$LOCKFILE" | cut -d' ' -f1)
          elif command -v shasum >/dev/null 2>&1; then
            h=$(shasum -a 256 "$LOCKFILE" | cut -d' ' -f1)
          else
            h=$(cksum "$LOCKFILE" | cut -d' ' -f1,2 | tr ' ' '-')
          fi
        fi
        echo "$h"
      outputs:
        lockhash: "{{ .Stdout | trim }}"

    - name: restore_node_modules_cache
      cache:
        path: "{{ .Params.working_dir }}/node_modules"
        key: "npm-{{ .Steps.hash_lockfile.Outputs.lockhash }}"
        restoreKeys:
          - "npm-"

    - name: npm_ci
      env:
        WORKING_DIR: "{{ .Params.working_dir }}"
      run: |
        #!/usr/bin/env sh
        set -eu
        cd "$WORKING_DIR"
        npm ci
        echo "[setup-node] npm ci complete in ${WORKING_DIR}"
