name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

jobs:
  # Build each image natively per architecture and push it by digest only
  # (no tags yet). arm64 uses GitHub's free native ARM runners for public
  # repos - no QEMU anywhere.
  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [controller, agent, k8s-agent, runner, artifact-sidecar]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          # Stamps the binary's version variable via -ldflags (see each
          # Dockerfile's ARG VERSION). github.ref_name is the release tag that
          # the merge job below applies to the image, so the version reported
          # by the running binary matches the tag it was pulled by. The runner
          # image ships no Go binary and ignores this arg.
          build-args: |
            VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/eirueimi/unified-cd-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  # Assemble the multi-arch manifest per image and apply the release tags.
  # Runs only when the entire build matrix succeeded, so a failed build
  # never moves any tag.
  merge:
    name: merge (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [controller, agent, k8s-agent, runner, artifact-sidecar]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push tags
        working-directory: /tmp/digests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/eirueimi/unified-cd-${{ matrix.image }}:latest \
            -t "ghcr.io/eirueimi/unified-cd-${{ matrix.image }}:$TAG" \
            $(printf 'ghcr.io/eirueimi/unified-cd-${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect manifest
        env:
          TAG: ${{ github.ref_name }}
        run: docker buildx imagetools inspect "ghcr.io/eirueimi/unified-cd-${{ matrix.image }}:$TAG"

  # Terminal guard: assert that the release actually released.
  #
  # `merge` is `needs: build`, so a SINGLE failed build leg skips all five
  # merge jobs and no tag moves for ANY image — including images whose own
  # legs built and pushed fine. That is not a hypothetical: the v0.4.0 run
  # lost only the two k8s-agent legs, the other eight succeeded, all five
  # merges were skipped, and the release silently did not happen. Nothing
  # said so loudly enough to be noticed for 13 days, during which `:latest`
  # still meant v0.3.0.
  #
  # The `needs: build` gate itself is deliberate and correct - a failed build
  # must never move a tag. What was missing is a step that states the outcome
  # in the run's own terms, and that verifies the promise README.md makes
  # ("Images are published to GitHub Container Registry on every `v*` tag")
  # against the registry rather than against job status alone.
  verify:
    name: Verify release tags were applied
    runs-on: ubuntu-latest
    needs: [build, merge]
    # Must run even when `build` failed and `merge` was skipped - that is
    # precisely the case this job exists to report.
    if: always()
    permissions:
      contents: read
      packages: read
    steps:
      - name: Assert the merge matrix ran and succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "build=$BUILD_RESULT merge=$MERGE_RESULT tag=$TAG"
          if [ "$MERGE_RESULT" != "success" ]; then
            echo "::error title=Release incomplete::merge was '$MERGE_RESULT' (build was '$BUILD_RESULT'), so NO image tags were applied for $TAG. Every image is affected, including those whose build legs succeeded. ':latest' still points at the previous release. Fix the build failure and re-push the tag."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert every image resolves at the release tag
        env:
          TAG: ${{ github.ref_name }}
        # Belt-and-braces over the job-status check above: confirms the tag is
        # actually resolvable in the registry for all five images, which is the
        # promise README.md makes. Catches a merge that reported success but
        # left a tag unset, which job status alone cannot detect.
        run: |
          set -uo pipefail
          missing=()
          for image in controller agent k8s-agent runner artifact-sidecar; do
            ref="ghcr.io/eirueimi/unified-cd-${image}:${TAG}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "ok      $ref"
            else
              echo "MISSING $ref"
              missing+=("$ref")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Release tags missing::${#missing[@]} of 5 images have no ${TAG} tag: ${missing[*]}"
            exit 1
          fi
          echo "All 5 images published at ${TAG}."

  manifests:
    name: Publish install bundles
    # After verify, not merely after merge: the bundles name the images, so
    # they should not be published until those images are confirmed good.
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to attach assets to the release
    steps:
      - uses: actions/checkout@v4
      # The bundles name the images this release just published, so they are
      # built from the tag rather than from whatever the overlays carry.
      - name: Build bundles pinned to ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build-manifests.sh dist/manifests "$TAG"
      # Belt-and-braces over the script's own guard: confirms the tag was
      # actually written into the rendered bundle rather than silently
      # skipped, so a no-op tag injection fails the release instead of
      # publishing an unpinned bundle.
      - name: Assert the built bundle carries the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          grep -q "ghcr.io/eirueimi/unified-cd-controller:$TAG" dist/manifests/core-install.yaml || {
            echo "::error title=Tag injection failed::dist/manifests/core-install.yaml does not reference ghcr.io/eirueimi/unified-cd-controller:$TAG"
            exit 1
          }
      # Wait for goreleaser to create the Release before trying to attach to
      # it. `release.yml` (goreleaser) and this workflow both fire
      # independently on the same `v*` tag push - nothing here ever waits for
      # the other workflow to start, let alone finish. goreleaser is the one
      # that creates the GitHub Release; this job only uploads assets to it.
      # On v0.6.0 - the first release to exercise this job - goreleaser took
      # 5m33s, and this workflow reached this step at 2m48s: not a near miss,
      # a two-and-a-half-minute gap. That run failed with "release not
      # found", and the fix was a manual re-run of this job. Since the image
      # pipeline is consistently the faster of the two, that failure was not
      # a fluke to shrug off - it will recur on every release until this
      # waits for the release to exist. This step does not call
      # `gh release create`: creating the release from here would race
      # goreleaser from the other side and risk clobbering the release notes
      # and binaries it is responsible for, the same care the `verify` job
      # above takes with images rather than assuming the merge job's success
      # implies the tags actually landed. Bounded at 10 minutes so a genuine
      # goreleaser failure fails this job with a clear reason instead of
      # hanging until the workflow's own timeout.
      - name: Wait for the release to exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null || {
            echo "::error title=Release not created::release $TAG was not created within 10 minutes; goreleaser (release.yml) may have failed, or has not been pushed the same tag"
            exit 1
          }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            dist/manifests/core-install.yaml \
            dist/manifests/install.yaml \
            dist/manifests/agent-only.yaml \
            --clobber
