name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        # internal/helmchart's tests render the chart with the helm binary and
        # skip when it is missing, so install it everywhere they run.
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Run unit tests
        shell: bash
        run: |
          go test ./... -short -race -count=1

  integration:
    name: Integration tests (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        # internal/helmchart's tests render the chart with the helm binary and
        # skip when it is missing, so install it everywhere they run.
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Run integration tests
        shell: bash
        run: |
          go test ./... -race -count=1

  # The host agent's securityContext support is only meaningful against a real
  # container runtime: a fake shell cannot observe UIDs, setgid inheritance or
  # rootless user namespaces. `go test ./...` above never sets the `integration`
  # build tag, so none of internal/agent's real-runtime tests ran in CI at all
  # until this job. It runs the claim-pod integration tests and the
  # securityContext parity golden (internal/paritycases.SecurityContextCases,
  # whose k8s twin runs in the `k8s` job) on the three runtime configurations
  # the design (docs/superpowers/specs/2026-10-23-host-security-context-design.md
  # section 10) names. The embedded ucd-sh shim is committed
  # (internal/shim/embedded), so no build step precedes the tests; the unit job's
  # freshness test fails if it is stale.
  #
  # docker-rootless is a diagnostic leg until it has proved stable: it needs a
  # user-session dockerd that GitHub's runner does not provide out of the box,
  # so a failure there must not block merges (continue-on-error). The other two
  # legs are required.
  host-runtime-integration:
    name: Host runtime integration (${{ matrix.leg }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: docker-rootful
            runtime: docker
            experimental: false
            rootless: "0"
          - leg: podman-rootless
            runtime: podman
            experimental: false
            rootless: "1"
          - leg: docker-rootless
            runtime: docker
            experimental: true
            rootless: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up rootless podman
        if: matrix.leg == 'podman-rootless'
        run: |
          set -eux
          # podman is preinstalled and, for a non-root user such as this
          # runner user, rootless by default. Assert that rather than assume
          # it: a leg that ran as root would test the wrong thing and pass.
          test "$(id -u)" -ne 0
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman info --format '{{.Host.IDMappings}}'
          id
          grep "^$(id -un):" /etc/subuid /etc/subgid
          podman run --rm docker.io/library/busybox:1.36 sh -c 'echo uid=$(id -u); cat /proc/self/uid_map'
      - name: Set up rootless docker
        if: matrix.leg == 'docker-rootless'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session
          # The runner image's apt sources carry no docker-ce-rootless-extras
          # (ubuntu-latest is now 26.04), so install Docker's static release
          # binaries, pinned, into the user's own bin directory instead.
          DOCKER_STATIC_VERSION=27.5.1
          base="https://download.docker.com/linux/static/stable/x86_64"
          mkdir -p "$HOME/bin"
          curl -fsSL "$base/docker-$DOCKER_STATIC_VERSION.tgz" | tar -xz -C "$HOME/bin" --strip-components=1
          curl -fsSL "$base/docker-rootless-extras-$DOCKER_STATIC_VERSION.tgz" | tar -xz -C "$HOME/bin" --strip-components=1
          export PATH="$HOME/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # Ubuntu 24.04+ restricts unprivileged user namespaces through
          # AppArmor, which rootlesskit needs and has no profile for here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Replace the runner's rootful daemon by a user-session one.
          sudo systemctl disable --now docker.service docker.socket
          sudo rm -f /var/run/docker.sock
          export XDG_RUNTIME_DIR="$HOME/.xdg-run"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # The setup tool wants a systemd user session, which a runner lacks.
          # Its failure is tolerated only because the daemon is then started by
          # hand and the assertions below prove the result either way.
          dockerd-rootless-setuptool.sh install || echo "setuptool did not complete; starting dockerd-rootless.sh by hand"
          # With systemd as PID 1 dockerd picks the systemd cgroup driver, which
          # needs a user session's D-Bus to create scopes ("requires
          # interactive authentication" without one); cgroupfs needs none.
          nohup dockerd-rootless.sh --exec-opt native.cgroupdriver=cgroupfs > "$HOME/dockerd-rootless.log" 2>&1 &
          for i in $(seq 1 60); do
            [ -S "$XDG_RUNTIME_DIR/docker.sock" ] && break
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          # Prove this is the rootless daemon and the rootful one is gone.
          test "$(id -u)" -ne 0
          docker info --format '{{.SecurityOptions}}' | grep -q rootless
          if docker -H unix:///var/run/docker.sock info >/dev/null 2>&1; then
            echo "the rootful docker daemon is still reachable"; exit 1
          fi
          docker run --rm docker.io/library/busybox:1.36 sh -c 'echo uid=$(id -u); cat /proc/self/uid_map'
      - name: Run host runtime integration tests
        shell: bash
        env:
          UCD_TEST_CONTAINER_RUNTIME: ${{ matrix.runtime }}
          UCD_TEST_EXPECT_ROOTLESS: ${{ matrix.rootless }}
          # A missing runtime or shim must fail, not skip (go test reports a
          # skip as ok).
          UCD_REQUIRE_RUNTIME: "1"
        run: |
          rc=0
          go test -tags integration ./internal/agent/ -run 'SecCtx|ClaimPod|ProbeSecurityContext' -count=1 -json -timeout 25m > host-test.json || rc=$?
          jq -j 'select(.Action=="output") | .Output' host-test.json
          test "$rc" -eq 0
          # No selected test may have skipped, and the parity golden must have
          # run all 12 of its cases.
          bash .github/scripts/check-test-json.sh host-test.json 'SecCtx|ClaimPod|ProbeSecurityContext' '^$' 'TestSecCtxParity_HostAgent/=12'

  # Build the k8s-agent image on every PR.
  #
  # No release Dockerfile was exercised in PR CI, so a commit could break an
  # image build and only fail 13 days later at `v*` tag time. That is exactly
  # how v0.4.0 was lost: `cmd/k8s-agent` transitively imports
  # internal/shim/embedded, whose embed_amd64.go `//go:embed ucd-sh-amd64`
  # needs a file that was not tracked in git at that tag, so both k8s-agent
  # legs failed with "pattern ucd-sh-amd64: no matching files found". The
  # eight other legs passed, the tag-applying `merge` job was skipped, and no
  # image was published for any of the five images.
  #
  # k8s-agent is the cheapest sufficient guard rather than an arbitrary pick:
  # it is the image that broke, and it is a `go build` of the package graph
  # that contains the embed. agent.Dockerfile depends on the same committed
  # ucd-sh-<arch> bytes, so building it too would catch the same class twice
  # for double the minutes; controller.Dockerfile (npm + vite + Go) is the
  # expensive one and is deliberately not built here.
  #
  # Cost: single-arch, no push, with a layer cache. ~1-2 min, and it runs in
  # parallel with the four jobs above - all of which are longer (the k8s job
  # alone starts a kind cluster and allows a 10m test timeout), so this does
  # not extend wall-clock CI.
  image-build:
    name: Image build (k8s-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the k8s-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/k8s-agent.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s:
    name: Kubernetes integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Load test pod image into kind
        # A pulled ubuntu:22.04 is a multi-platform index whose other
        # platforms' blobs are not stored locally, so `kind load` (which
        # imports `docker save` output into containerd) fails with "content
        # digest ...: not found". Rebuilding it under the same tag yields a
        # single-platform image that imports cleanly, like ucd-shim-test below.
        run: |
          set -euo pipefail
          docker pull ubuntu:22.04
          echo 'FROM ubuntu:22.04' | docker build -t ubuntu:22.04 -
          kind load docker-image ubuntu:22.04 --name ci
          # The securityContext parity golden (secctx_parity_k8s_test.go) runs
          # every case in this image; load it so a registry rate limit cannot
          # fail a pod pull.
          docker pull busybox:1.36
          echo 'FROM busybox:1.36' | docker build -t busybox:1.36 -
          kind load docker-image busybox:1.36 --name ci
      - name: Build and load a real shim image into kind
        # The k8s job's tests build real Pods, and BuildPod (internal/k8sagent/podbuilder.go)
        # always prepends a ucd-shim init container that runs
        # "/ucd-sh --install /.ucd/ucd-sh" from whatever image Config.ShimImage
        # names. Without a real image containing /ucd-sh, Kubernetes rejects
        # the pod outright ("spec.initContainers[0].image: Required value" if
        # empty, or an ImagePullBackOff if non-empty but unreachable). Build
        # the shim binary from this checkout, package it into a minimal
        # scratch image (ucd-sh is a static Go binary — its --install mode
        # execs itself, no shell needed), and load it into the kind cluster
        # so no registry pull is required. The Dockerfile is generated inline
        # (not committed) so there is no stray tracked file to maintain.
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ucd-sh ./cmd/ucd-sh
          workdir="$(mktemp -d)"
          cp ucd-sh "$workdir/ucd-sh"
          rm -f ucd-sh
          printf 'FROM scratch\nCOPY ucd-sh /ucd-sh\n' > "$workdir/Dockerfile.shim-test"
          docker build -t ucd-shim-test:ci -f "$workdir/Dockerfile.shim-test" "$workdir"
          rm -rf "$workdir"
          kind load docker-image ucd-shim-test:ci --name ci
      - name: Run k8s integration tests
        shell: bash
        env:
          # kind-loaded images are not on any registry; the init container's
          # default pull policy (no policy is set in podbuilder.go, and this
          # tag is not ":latest") resolves to IfNotPresent, which is
          # satisfied by a kind-loaded image without a pull attempt.
          UCD_K8S_TEST_SHIM_IMAGE: ucd-shim-test:ci
        run: |
          rc=0
          go test -tags k8s ./internal/k8sagent/... -timeout 20m -json > k8s-test.json || rc=$?
          jq -j 'select(.Action=="output") | .Output' k8s-test.json
          test "$rc" -eq 0
          # The securityContext golden must not have skipped anything but its three
          # documented host-only cases, and must have run the other 9 (the =9 below).
          bash .github/scripts/check-test-json.sh k8s-test.json 'SecCtx' '^TestSecCtxParity_K8s/secctx-volume-' 'TestSecCtxParity_K8s/=9'

  # The Helm chart (charts/unified-cd) is the single source of the install
  # bundles, so CI proves three things: it lints, every bundle it renders is
  # accepted by a real API server, and a default (trial) install on kind comes
  # up, enrolls its Kubernetes agent, survives `helm upgrade` with its KEK
  # untouched, and leaves the KEK and the job namespace behind on uninstall.
  helm:
    name: Helm chart (lint + kind install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NS: unified-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint the chart
        run: |
          set -euo pipefail
          helm lint --strict charts/unified-cd
          for f in charts/unified-cd/bundles/*.values.yaml; do
            helm lint --strict charts/unified-cd -f "$f"
          done
      - name: Render the install bundles
        run: scripts/build-manifests.sh dist/m
      - name: Start kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: helm-ci
      - name: Build and load the first-party images into kind
        # VERSION=ci only labels the binaries; the images are tagged :ci and
        # the chart is pointed at them below. kind-loaded images are not on
        # any registry, and the chart's pull policy (IfNotPresent) is
        # satisfied by them without a pull.
        run: |
          set -euo pipefail
          docker build --build-arg VERSION=ci -f docker/controller.Dockerfile -t unified-cd-controller:ci .
          docker build --build-arg VERSION=ci -f docker/k8s-agent.Dockerfile -t unified-cd-k8s-agent:ci .
          kind load docker-image unified-cd-controller:ci unified-cd-k8s-agent:ci --name helm-ci
      - name: Load third-party images into kind
        # The trial install pulls three Docker Hub images inside kind. Pull
        # them here instead and rebuild each under the same tag: a pulled
        # multi-platform index has other platforms' blobs missing locally, so
        # `kind load` would fail with "content digest ...: not found" (see the
        # k8s job). Doing it on the runner also sidesteps in-cluster pull
        # rate limits.
        run: |
          set -euo pipefail
          for img in postgres:16-alpine dxflrs/garage:v2.3.0 alpine/k8s:1.31.2; do
            docker pull "$img"
            echo "FROM $img" | docker build -t "$img" -
            kind load docker-image "$img" --name helm-ci
          done
      - name: Install the chart (trial defaults)
        run: |
          set -euo pipefail
          helm install unified-cd charts/unified-cd -n "$NS" --create-namespace \
            --set controller.image.repository=unified-cd-controller,controller.image.tag=ci \
            --set agent.image.repository=unified-cd-k8s-agent,agent.image.tag=ci \
            --wait --timeout 10m
      - name: Server-side dry-run of every rendered bundle
        # Run after the install so the unified-cd namespace exists: a server
        # dry-run of namespaced objects needs it, and the bundle's own
        # Namespace object is not created by a dry-run.
        run: |
          set -euo pipefail
          for f in dist/m/*.yaml; do
            echo "== $f"
            kubectl apply --dry-run=server -f "$f"
          done
      - name: Assert the install works
        shell: bash
        run: |
          set -euo pipefail
          # The KEK Job is a pre-install hook deleted on success
          # (hook-delete-policy hook-succeeded), so wait for the Secret it
          # creates, not for the Job.
          for i in $(seq 1 90); do
            kubectl -n "$NS" get secret unified-cd-controller-kek >/dev/null 2>&1 && break
            [ "$i" -eq 90 ] && { echo "KEK secret never appeared"; exit 1; }
            sleep 2
          done
          kubectl -n "$NS" wait --for=condition=Available deployment/unified-cd-controller --timeout=5m

          start_pf() {
            kubectl -n "$NS" port-forward svc/unified-cd-controller 18080:80 >>pf.log 2>&1 &
            echo $! > pf.pid
          }
          start_pf
          # GET /api/v1/agents returns a bare JSON array of agents, each with a
          # "labels" string array; the Kubernetes agent carries kind:kubernetes.
          # Every call is time-bounded so a half-open port-forward cannot hang
          # an iteration, and a dead port-forward is restarted.
          enrolled=""
          for i in $(seq 1 100); do
            kill -0 "$(cat pf.pid)" 2>/dev/null || { sleep 1; start_pf; sleep 2; }
            if curl -fsS --connect-timeout 3 --max-time 5 \
                 -H 'Authorization: Bearer dev-token-change-me' \
                 -o agents.json http://127.0.0.1:18080/api/v1/agents 2>/dev/null \
               && jq -e 'any(.[]; (.labels // []) | any(. == "kind:kubernetes"))' agents.json >/dev/null 2>&1; then
              enrolled=1; break
            fi
            sleep 3
          done
          [ -n "$enrolled" ] || { echo "no agent with label kind:kubernetes enrolled"; exit 1; }

          kek_before=$(kubectl -n "$NS" get secret unified-cd-controller-kek -o jsonpath='{.data.kek}')
          [ -n "$kek_before" ]

          # An upgrade must neither fail nor regenerate the KEK.
          helm upgrade unified-cd charts/unified-cd -n "$NS" --reuse-values \
            --set agent.config.maxConcurrent=3 --wait --timeout 10m
          kek_after=$(kubectl -n "$NS" get secret unified-cd-controller-kek -o jsonpath='{.data.kek}')
          [ "$kek_before" = "$kek_after" ] || { echo "KEK changed across helm upgrade"; exit 1; }

          # Uninstall keeps the KEK (it is not a Helm-managed object, so losing
          # it would orphan every encrypted credential) and the job namespace.
          kill "$(cat pf.pid)" 2>/dev/null || true
          helm uninstall unified-cd -n "$NS" --wait
          kek_final=$(kubectl -n "$NS" get secret unified-cd-controller-kek -o jsonpath='{.data.kek}')
          [ "$kek_before" = "$kek_final" ] || { echo "KEK missing or changed after uninstall"; exit 1; }
          kubectl get namespace ci
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs deployment/unified-cd-controller --tail=200 || true
          kubectl -n "$NS" logs deployment/unified-cd-k8s-agent --tail=200 || true
          cat pf.log || true
          echo "== last /api/v1/agents response"; cat agents.json || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          helm status unified-cd -n "$NS" || true
