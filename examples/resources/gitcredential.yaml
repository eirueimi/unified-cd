# GitCredential — per-host authentication for private Git repositories.
# Credentials are resolved automatically when a job accesses a git:// URI for the matching host.
#
# Usage:
#   unified-cd secret set github-token <personal-access-token>
#   unified-cd apply -f examples/resources/gitcredential.yaml
#   unified-cd run trigger private-template-job

# ── GitHub personal access token ─────────────────────────────────────────
apiVersion: unified-cd/v1
kind: GitCredential
metadata:
  name: github-org
spec:
  # credentials for this hostname are applied to any git:// access targeting it
  host: github.com
  type: token             # token: PAT / OAuth token | sshKey: SSH private key | githubApp: see below
  secretRef: github-token # name of a StoredSecret containing the credential value

---
# ── SSH key example (also works for GitLab, Gitea, etc.) ─────────────────
apiVersion: unified-cd/v1
kind: GitCredential
metadata:
  name: gitlab-internal
spec:
  host: gitlab.example.com
  type: sshKey
  secretRef: gitlab-ssh-key

---
# ── GitHub App (short-lived installation tokens) ─────────────────────────
# secretRef names a StoredSecret holding the App's PEM private key
# (unified-cd secret set github-app-key -f app-private-key.pem). The key never
# leaves the controller. controllerUse (default true) lets the controller use
# the credential for AppSource syncs and git:// templates; jobAccess lets jobs
# under the listed folders receive a token as {{ .Secrets.gh-app-release }}.
# Without jobAccess, jobs can never use the credential. Several credentials may
# share a host; for the controller the most recently updated eligible one wins.
apiVersion: unified-cd/v1
kind: GitCredential
metadata:
  name: gh-app-release    # shares the secrets namespace: no StoredSecret may use this name
spec:
  host: github.com
  type: githubApp
  secretRef: github-app-key
  controllerUse: true
  githubApp:
    appId: 123456
    installationId: 7890123   # optional: looked up from the repository owner when omitted
    # apiURL: https://ghe.example.com/api/v3   # GitHub Enterprise Server only
  jobAccess:
    folders: [team-a, platform/tools]          # "*" = every job
    repositories: [acme/app, acme/infra-*]     # one owner only
    permissions:                               # highest level a token may carry
      contents: write
      pull_requests: write

---
# ── Job that uses the credentials above ──────────────────────────────────
# Credentials for github.com and gitlab.example.com are applied automatically.
apiVersion: unified-cd/v1
kind: Job
metadata:
  name: private-template-job
spec:
  steps:
    - name: buildWithPrivateTemplate
      uses:
        # private repo — github-org credential is applied automatically
        job: git://github.com/my-private-org/ci-templates/jobs/build.yaml@v1.0.0
        with:
          target: ./cmd/...

    - name: deployWithPrivateTemplate
      # top-level steps already run sequentially in declaration order
      # (needs: was removed — use parallel: blocks for concurrent execution)
      uses:
        # different host — gitlab-internal credential is applied automatically
        job: git://gitlab.example.com/infra/ci-templates/jobs/deploy.yaml@main
        with:
          environment: production
