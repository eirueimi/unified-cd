# unified-cd agent configuration file
# Usage: agent -f agent-config.yaml
#
# Priority: CLI flags > this file > environment variables
# All fields are optional; omit to fall back to env vars or defaults.

server: http://unified-cd-master:8080
id: my-agent-1
# The one-time file contains a uce_ enrollment credential. The agent consumes
# it on first start and writes its rotating refresh credential here. Keep both
# paths private; do not pass credential values as arguments or environment.
credentialFile: /var/lib/unified-cd-agent/credentials.json
enrollmentTokenFile: /var/lib/unified-cd-agent/enrollment.token
labels:
  - kind:linux
  - env:prod

# pauseImage: image for the claim pod's pause (netns-holder) container, one per claim.
# The built-in default is busybox:1.36 pinned by digest; setting this replaces it.
# pauseImage: busybox:1.36

# runnerImage: primary container image injected into the claim pod when an isolated job's
# podTemplate defines no container of its own. Leave it unset to get the runner published
# with this agent's release (the tag matches the agent's version; :latest for a locally
# built agent). Set it to a digest to pin the image:
# runnerImage: ghcr.io/eirueimi/unified-cd-runner@sha256:<digest>

# finallyTimeout: ceiling on each of a run's post-DAG cleanup phases — each
# post:/cache: hook drain, the spec.finally pipeline, and scope/claim-pod
# teardown. Those phases keep running after a cancellation (that is what
# finally: is for), which also means they cannot inherit spec.timeoutMinutes,
# so this replaces it. It is per phase, so the worst-case post-DAG time is 4x
# this value (40m at the default). Unset or non-positive -> 10m. Per-step
# timeoutMinutes: works inside finally: and is the precise control; this is
# only the backstop.
# finallyTimeout: 10m

# minFreeDisk: stop claiming new runs while the workspace filesystem has less free space than this.
# A named volume below it only keeps back the runs that mount it (they stay Queued). Accepted forms:
# a percentage of the filesystem ("1%"), a size ("10GiB"), or a byte count (5368709120, the legacy
# form). The default is "1%", so the check is ON unless you set 0 or "off" (which disables it). A
# malformed value fails startup. The resolved value is exported as the metric
# unifiedcd_agent_min_free_disk_bytes (0 there means "disabled", not "no space left"), and
# unifiedcd_agent_claim_blocked_by_disk / unifiedcd_agent_volume_claim_blocked show when it is acting.
# A floor, not a margin: choose it larger than what one run can write (see the operations guide).
# minFreeDisk: "1%"         # the default
# minFreeDisk: "20GiB"      # an absolute floor
# minFreeDisk: 0            # disable the check

# volumes: agent-owned named volumes that jobs mount with spec.volumes. A workspace with no
# volume is emptied before and after every run; a volume is the only thing that survives
# between runs. A volume name exists once per agent (two agents declaring the same name hold
# two independent copies). This list is file-only: it has no flag or environment variable.
# volumes:
#   - name: unity-main
#     mode: exclusive      # required: at most one run on this agent holds the volume at a time
#     path: /var/lib/unified-cd/volumes/unity-main   # optional; default <workspaceDir>/volumes/<name>
#     size: 200Gi          # advisory: the agent warns when usage exceeds it, it never enforces it;
#                          # real free space is the metric unifiedcd_agent_volume_filesystem_free_bytes
#   - name: go-cache
#     mode: shared         # any number of runs may use it at once; the job must tolerate that

# Garage cache (all fields required to enable cache; omit section to disable)
cacheEndpoint: garage:3900
cacheKey: garageadmin
cacheSecret: garageadmin12345
cacheBucket: unified-cd-cache
