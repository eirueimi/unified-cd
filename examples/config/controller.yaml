# unified-cd controller configuration file
# Usage: controller -f controller-config.yaml
#
# Priority: CLI flags > this file > environment variables
# All fields are optional; omit to fall back to env vars or defaults.

dsn: postgres://unified:password@postgres:5432/unified_cd?sslmode=disable
addr: :8080

# There is no static admin token. Without SSO the first admin exchanges a one-time
# initial token (written to initial-admin-token next to this file, or provided as
# UNIFIED_INITIAL_ADMIN_TOKEN) with `unified-cli bootstrap`. A leftover `token:` key or
# UNIFIED_TOKEN is ignored with an error log. See
# docs/operator-manual/migrations/2026-11-27-internal-accounts.md

# Service accounts for CI and other automation (work with or without SSO).
# The built-in "admin" account accepts only `enabled`; set it to false once SSO works.
# Create a PAT for one with: unified-cli token create <name> --account ci-deploy
# serviceAccounts:
#   admin:
#     enabled: true
#   ci-deploy:
#     permissions:
#       global: [viewer]
#       folders:
#         team-a: developer
#         team-a/prod: [job.read, run.trigger]

# PAT lifetimes (Go durations). Every new PAT expires; 0 for maxLifetime removes the cap.
# tokens:
#   defaultLifetime: 2160h   # 90 days
#   maxLifetime: 8760h       # 365 days

# Under SSO the web UI hides the manual token form; true brings it back.
# ui:
#   allowTokenEntry: false

# The encryption key is supplied outside this file:
#   UNIFIED_CONTROLLER_KEY_FILE=/etc/unified-cd/kek   (generate with `unified-cli keygen --out`)
# or UNIFIED_KMS_URI=hashivault://unified-cd-kek

# S3-compatible object store for log archival and cache (optional)
s3Endpoint: garage:3900
s3Bucket: unified-cd
s3Key: garageadmin
s3Secret: garageadmin12345

# Local object store alternative to S3 (mutually exclusive with s3*)
# dataDir: /var/lib/unified-cd

# Kubernetes workload enrollment for k8s-agent Pods. With no kubeconfig, the
# controller uses its in-cluster ServiceAccount identity.
agentAuth:
  kubernetesClusters:
    - name: in-cluster
  kubernetesEnrollmentPolicies:
    - name: unified-cd-k8s-agents
      cluster: in-cluster
      namespaces: [unified-cd]
      serviceAccounts: [unified-cd-k8s-agent]
      allowedLabels: [kind:kubernetes]
      requiredLabels: [kind:kubernetes]
      accessTokenTTL: 1h
      enabled: true

# OIDC SSO (optional)
# oidc:
#   issuer: https://accounts.google.com
#   issuerInternal: ""        # override for in-cluster IdP access
#   clientId: your-client-id
#   clientSecret: your-client-secret
#   # Optional: replaces the requested scopes (default: openid email profile plus
#   # oidc.rolesClaim when it is a bare word). Use it when the IdP rejects that
#   # extra scope. openid is added if missing. Env: UNIFIED_OIDC_SCOPES (comma-separated).
#   # scopes: [openid, email, profile]
#   # Optional, additive: grants on top of the roleMap/userMap/defaultRole role.
#   # Values are a role name, a permission name, or a list mixing both.
#   # Config file only (no env var); requires oidc.issuer.
#   permissions:
#     global:
#       groups:
#         "my-org:engineering": [agent.read, appsource.read, webhook.read, vars.read, token.create]
#         "my-org:auditors":    [viewer, audit.read]
#     folders:
#       team-a:
#         groups:
#           "my-org:team-a": developer
#       team-a/prod:
#         groups:
#           "my-org:sre": [job.read, run.approve]
#       team-b:
#         groups:
#           "my-org:team-b": developer
#         users:
#           contractor@example.com: [job.read, run.trigger]
