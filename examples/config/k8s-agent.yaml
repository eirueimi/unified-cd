# Kubernetes workload enrollment requires HTTPS except for explicit local development.
server: https://unified-cd-master.example.com
enrollmentPolicy: unified-cd-k8s-agents
serviceAccountTokenFile: /var/run/secrets/unified-cd-agent/token
labels:
  - kind:kubernetes
namespace: ci
maxConcurrent: 5
# poolIdleTimeout: how long idle pooled pods are kept before deletion (e.g. "30m", "1h").
# Omit or set to "" to disable eviction (idle pods live until the agent restarts).
poolIdleTimeout: ""
# finallyTimeout: ceiling on each of a run's post-DAG cleanup phases — each
# post:/cache: hook drain, the spec.finally pipeline, and scope/Pod teardown.
# Those phases keep running after a cancellation (that is what finally: is
# for), which also means they cannot inherit spec.timeoutMinutes, so this
# replaces it. It is per phase, so on THIS agent the worst-case post-DAG time
# is 5x this value (50m at the default): four windows in the shared cleanup
# loop, plus a fifth for the claim Pod's own deletion or return to the idle
# pool, which runs after that loop has finished. Size a rollout's
# terminationGracePeriodSeconds against 50m, not 40m. Unset or non-positive
# -> 10m ("unbounded" is not expressible); an unparseable value is rejected at
# startup and the agent exits 1.
# finallyTimeout: 10m
# Agent-owned named volumes (spec.volumes in a Job). Each becomes a PVC named
# <agentName>-<volume>, created at startup and never deleted by the agent.
# agentName must stay the same across restarts; it is not the enrolled agent ID.
# Required when `volumes` is set, and never change it while a volume holds data: the PVC names
# derive from it, so a new name provisions new, empty PVCs and orphans the old ones.
# agentName: ci-main
# volumes:
#   - name: go-cache         # a DNS label here: lower-case letters, digits and "-"
#     mode: exclusive        # exclusive -> ReadWriteOnce; shared -> ReadWriteMany (needs an RWX StorageClass)
#     size: 20Gi             # required on Kubernetes
#     # storageClassName: gp3  # omit to use the cluster default
#
# The agent's Role needs get, list, create and update on persistentvolumeclaims (see
# manifests/base/k8s-agent/rbac.yaml). A freshly provisioned PVC is usually root-owned: a job
# whose image runs as a non-root user needs securityContext.fsGroup in its podTemplate.

# minFreeDisk: stop claiming runs that mount a named volume (see volumes below) while that volume has
# less free space than this. Forms: a percentage ("1%"), a size ("10Gi"), a byte count, or 0 / "off" to
# disable. The default is "1%", so the check is ON unless you disable it; a malformed value fails
# startup. A volume is measured only by runs that mount it, so a reading older than 10 minutes stops
# gating (runs go through until one re-measures the volume) and restarting the agent clears it. This loader ignores unknown
# keys: a misspelled minFreeDisk is silently ignored, so copy the key exactly.
# minFreeDisk: "1%"
#
# workspaceSizeLimit: cap each run's workspace emptyDir (sizeLimit) and reserve the same amount as an
# ephemeral-storage request on the job container, so one run cannot fill the node. UNSET by default
# (no cap); a limit that is too small evicts legitimate runs. Not applied when the pod template already
# sets ephemeral-storage or the workspace is a named volume. A podTemplates.<name>.workspaceSizeLimit
# overrides it for that template.
# workspaceSizeLimit: 20Gi

# podImage: fallback image when a Job does not specify a podTemplate. Leave it unset to get the
# runner published with this agent's release (the tag matches the agent's version; :latest for
# a locally built agent). Set it to pin a different image, or to a digest to make the runner
# immutable. The same applies to sidecarImage and shimImage, which default the same way.
# podImage: ghcr.io/eirueimi/unified-cd-runner@sha256:<digest>

# jobPodPolicy: which Pod fields a JOB's OWN podTemplate content (an inline spec, an override
# patch) may use on this agent. File-only (no environment variables). Every key is optional and
# the values below are the defaults: with this block absent or empty, a job that names a
# ServiceAccount, hostPath, a Kubernetes Secret, a PVC, privileged: true, nodeName, ... is failed
# at claim time with "k8s: job pod policy: ...", before any Pod is created. The podTemplates below
# are operator-written and are NOT filtered. Names are listed one by one (no wildcards). The agent
# refuses to start on an unknown key or a bad name. Uncomment only what your jobs need. See
# docs/operator-manual/kubernetes-integration.md, "Job Pod field policy".
# jobPodPolicy:
#   allowServiceAccounts: []        # serviceAccountName values a job may set; also gates
#                                   # automountServiceAccountToken: true and projected tokens
#   allowSecrets: []                # Secrets a job may read (secretKeyRef, secretRef, secret
#                                   # volumes); may not name sidecarS3SecretName
#   allowImagePullSecrets: []       # imagePullSecrets a job may name
#   allowPersistentVolumeClaims: [] # claimName values; may not name <agentName>-<volume>
#   allowHostAccess: false          # hostPath, hostNetwork/hostPID/hostIPC, hostPort, probe hosts
#   allowPrivileged: false          # privileged, non-baseline capabilities, procMount, sysctls, ...
#   allowUnconfinedProfiles: false  # seccomp / AppArmor Unconfined (e.g. rootless BuildKit)
#   allowNodeName: false            # nodeName
#   allowPodSpecFields: []          # e.g. [runtimeClassName, priorityClassName, shareProcessNamespace]
#   allowVolumeTypes: []            # e.g. [nfs, csi, ephemeral]

podTemplates:
  # template name: referenced by podTemplate.name in Job YAML
  golang:
    workspace:
      mountPath: /workspace
      # The workspace is always an emptyDir: empty at the start of every run, discarded with the
      # Pod. (podTemplate.reuse keeps the Pod, but the agent empties the workspace on every claim.)
      # To keep data between runs, declare a named volume under `volumes:` above and mount it
      # from the job with spec.volumes.
    # workspaceSizeLimit: 40Gi   # overrides the global workspaceSizeLimit for this template
    spec:
      containers:
        - name: job
          image: golang:1.24-alpine
          # command omitted → agent injects ["/.ucd/ucd-sh", "pause"] automatically
          # workspace volumeMount is injected by the agent — no need to specify it
        # NOTE: the shipped `ci` namespace enforces Pod Security `baseline`
        # (manifests/base/namespace/namespace.yaml), which REFUSES `privileged: true`, even in an
        # operator template like this one. To use this Docker-in-Docker container, run this agent
        # in a separate namespace labelled pod-security.kubernetes.io/enforce=privileged (or
        # relabel `ci`). jobPodPolicy does not apply here: templates are not filtered.
        - name: docker
          image: docker:24-dind
          securityContext:
            privileged: true
      volumes:
        - name: docker-sock
          emptyDir: {}

  node:
    workspace:
      mountPath: /workspace
    spec:
      containers:
        - name: job
          image: node:20-alpine
        - name: playwright
          image: mcr.microsoft.com/playwright:v1.44.0-jammy
