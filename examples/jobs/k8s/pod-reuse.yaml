# Demonstrates: Pod reuse across runs to skip Pod startup (scheduling and image pulls)
# Usage:
#   unified-cd apply -f examples/jobs/k8s/pod-reuse.yaml
#   unified-cd run trigger incremental-build
#
# reuse: true returns the Pod to a pool when the run ends instead of deleting it, so the next
# run of a job with the same template starts in seconds instead of waiting for the cluster.
# It does NOT carry the workspace over: the agent empties /workspace before every claim, and
# if it cannot, the run fails and the Pod is deleted rather than returned to the pool. A run
# therefore never sees another run's files, whichever Pod it lands on.
#
# To keep files between runs, use one of:
#   - cache: (examples/jobs/cache.yaml) for dependency directories, as below. Needs the
#     k8s-agent's sidecarS3SecretName to be set.
#   - a named volume (examples/jobs/volumes.yaml). A job that mounts one cannot also set
#     reuse: true; apply rejects the combination, because a pooled Pod keeps the volumes it was
#     created with.
apiVersion: unified-cd/v1
kind: Job
metadata:
  name: incremental-build
spec:
  agentSelector:
    - kind:kubernetes
  podTemplate:
    name: golang
    reuse: true
  steps:
    # Restore the module cache into the (empty) workspace; saved after the run on a miss.
    - name: restore_modules
      cache:
        path: .gomodcache
        # A real job would derive the key from the lockfile, e.g.
        #   key: go-mod-{{ hashFile "go.sum" }}
        # This demo has no source checkout, so the key is static.
        key: incremental-build-modules-v1

    # A real job checks out its sources first (for example with the checkout template in
    # templates/); the workspace starts empty.
    - name: build
      run: |
        export GOMODCACHE="$UNIFIED_WORKSPACE/.gomodcache"
        cd /workspace && go build ./...
