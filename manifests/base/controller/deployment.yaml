apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-cd-controller
  namespace: unified-cd
  labels:
    app: unified-cd-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-cd-controller
  template:
    metadata:
      labels:
        app: unified-cd-controller
    spec:
      serviceAccountName: unified-cd-controller
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: ghcr.io/eirueimi/unified-cd-controller:latest
          args: ["-f", "/etc/unified-cd/controller-config.yaml"]
          ports:
            - containerPort: 8080
          env:
            - name: UNIFIED_CONTROLLER_KEY_FILE
              value: /etc/unified-cd/kek
          envFrom:
            - secretRef:
                name: unified-cd-controller
          # No CPU limit: a CPU limit throttles the container even when the
          # node is idle, whereas a memory limit is what actually contains a
          # runaway process. These values are a conservative floor for a
          # normal controller workload, not a capacity estimate — raise them
          # if you see throttling or OOMKills under your load.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: controller-config
              mountPath: /etc/unified-cd/controller-config.yaml
              subPath: controller-config.yaml
              readOnly: true
            - name: controller-kek
              mountPath: /etc/unified-cd/kek
              subPath: kek
              readOnly: true
      volumes:
        - name: controller-config
          configMap:
            name: unified-cd-controller-config
        - name: controller-kek
          secret:
            secretName: unified-cd-controller-kek
            items:
              - key: kek
                path: kek
            defaultMode: 0400
