apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: unified-cd
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: unified
            - name: POSTGRES_PASSWORD
              value: unified
            - name: POSTGRES_DB
              value: unified
          # No CPU limit: a CPU limit throttles the container even when the
          # node is idle, whereas a memory limit is what actually contains a
          # runaway process. These values are a conservative floor for a
          # normal unified-cd workload, not a capacity estimate — raise them
          # if you see throttling or OOMKills under your load.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "unified"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "unified"]
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
