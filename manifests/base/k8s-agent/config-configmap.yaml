apiVersion: v1
kind: ConfigMap
metadata:
  name: unified-cd-k8s-agent-config
  namespace: unified-cd
data:
  k8s-agent-config.yaml: |
    # Production requires an externally supplied TLS endpoint. The controller
    # Service itself listens on HTTP only and is not a TLS terminator.
    server: https://controller.example.invalid
    enrollmentPolicy: unified-cd-k8s-agents
    serviceAccountTokenFile: /var/run/secrets/unified-cd-agent/token
    labels:
      - kind:kubernetes
    namespace: ci
    maxConcurrent: 5
    # podImage overrides the default runner image (the unified-cd-runner image
    # published with the agent's release) with a plain Go toolchain image, so a job
    # that declares no podTemplate runs in Go. It is a third-party tag that does
    # not follow the agent's version. Remove the line to use the runner image
    # matching the agent's version instead.
    podImage: golang:1.24-alpine
