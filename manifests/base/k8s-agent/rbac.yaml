apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unified-cd-k8s-agent
  namespace: ci
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    # update/patch are required by pod reuse (podTemplate.reuse): the pool marks
    # a finished pod idle by updating its annotations (PodManager.UpdatePodAnnotations,
    # PodPool.ReleasePod). Without update, that call is forbidden and the pool
    # falls back to deleting the pod every run — reuse silently never happens.
    verbs: ["create", "get", "list", "delete", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # Agent-owned named volumes (the agent config's `volumes`): the agent looks
    # up and lists its PVCs at startup (get, list), creates the missing ones
    # (create), and takes and releases an exclusive volume by updating the
    # claim's lock annotation (update). It never deletes a volume's PVC itself;
    # delete is kept from before named volumes existed.
    verbs: ["create", "get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unified-cd-k8s-agent
  namespace: ci
subjects:
  - kind: ServiceAccount
    name: unified-cd-k8s-agent
    namespace: unified-cd
roleRef:
  kind: Role
  name: unified-cd-k8s-agent
  apiGroup: rbac.authorization.k8s.io
