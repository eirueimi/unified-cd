# S3 interposer for the edge-case campaign (W3+): an nginx that sits between
# the unified-cd processes and Garage, so an S3 fault can be made
# METHOD-selective and KEY-PREFIX-selective instead of all-or-nothing.
#
# Why it exists: every pre-existing lever against object storage
# (inject.sh pause/kill-hard/partition garage) takes the whole store down.
# W3-1 needs a Delete to succeed while a Get stream is open; W3-2 wants Put to
# fail while reads keep working; W3-6 wants the artifact Put window widened
# without touching anything else. None of those are expressible as "Garage is
# down".
#
# Used with compose/s3proxy.override.yaml, which repoints
# UNIFIED_S3_ENDPOINT (all three controllers) and UNIFIED_CACHE_ENDPOINT (both
# agents) at s3proxy:3900. Armed with tools/inject.sh s3-block / s3-latency /
# s3-slow / s3-clear / s3-probe / s3-show.
#
# ---------------------------------------------------------------------------
# SIDE SELECTION IS FREE, because the rig gives each side its own bucket and
# the bucket is the first path segment of a path-style S3 request:
#
#   /unified-cd-logs/runs/<runId>/logs.ndjson   controller, log archival
#   /unified-cd-logs/artifacts/<runId>/<name>   controller, artifacts
#   /unified-cd-cache/caches/<jobhash>/<key>    AGENT, cache save/restore
#
# So `s3-block PUT unified-cd-cache/` faults only the agent cache path and
# `s3-block PUT unified-cd-logs/artifacts/` only the controller's artifact
# path, with everything else untouched.
#
# ---------------------------------------------------------------------------
# THE W2-5 LESSON (`nginx -s reload` is not guaranteed to take effect on an
# already-connected client) is answered here by `keepalive_timeout 0` rather
# than by nginx-logfault.conf's `worker_shutdown_timeout 1s`, and the choice is
# deliberate:
#
#   * On reload, nginx's OLD workers close their listening sockets immediately;
#     only ALREADY-ESTABLISHED connections keep the old config. With
#     keepalive_timeout 0 this proxy never has an established idle connection
#     to carry a stale config — it answers `Connection: close` and the client
#     (minio-go / Go's http.Transport, on both the controller and the agent
#     side) dials again for the next request. So the request AFTER a reload is
#     served by a new worker with the new config, deterministically.
#
#   * `worker_shutdown_timeout 1s` would achieve the same thing by KILLING the
#     old workers — and with them every request still in flight. That is
#     exactly wrong here: this proxy carries multi-megabyte artifact PUTs and
#     cache-restore GET streams, and W3-1's whole mechanism is a GET stream
#     that must stay open across an out-of-band delete. Severing it on every
#     arm would destroy the measurement instead of making it.
#
# W3-4's separate warning — that `worker_shutdown_timeout 1s` severs in-flight
# SSE streams and long-poll claims on every reload — DOES NOT APPLY to this
# proxy in either of its two forms. This nginx carries S3 traffic only:
# controller->Garage and agent->Garage. SSE (`GET /runs/{id}/events`) and the
# agent's long-poll claim both go to the OTHER nginx (`nginx:8080`, the
# controller LB) and never traverse port 3900. Confirmed against the route
# table: internal/controller/server.go:337 registers /api/v1/runs/{id}/events
# on the controller, not on any object-store path.
#
# NEITHER argument is a licence to skip the probe. `s3-probe` re-evaluates the
# live arm files through the same include, and the `s3fault` access-log format
# below stamps `arm=` onto EVERY request, so an armed/cleared claim is always
# made per request rather than per wall-clock window.
#
# Keep in sync with test/ha/docker-compose.ha.yaml's garage service.

events {}
http {
  # The authoritative bracket: every request records which arm the worker that
  # served it had loaded, its method, its key, and the status it returned.
  log_format s3fault '$msec $time_iso8601 $status arm=$s3_arm '
                     'method=$request_method uri=$uri '
                     'ustatus=$upstream_status rt=$request_time '
                     'urt=$upstream_response_time reqlen=$request_length '
                     'bytes=$body_bytes_sent from=$remote_addr';
  access_log /dev/stdout s3fault;

  upstream garage_up {
    server garage:3900;
  }

  # Latency arm. 192.0.2.1 is TEST-NET-1 (RFC 5737) — routable nowhere, so a
  # connect to it hangs rather than being refused, and nginx gives up after
  # proxy_connect_timeout and falls through to the `backup` (real Garage).
  # The delay is therefore exactly proxy_connect_timeout, set per-arm by the
  # include file. max_fails=0 keeps nginx from ejecting the dead primary, so
  # the delay applies to EVERY request for as long as the arm is up instead of
  # decaying after the first failure.
  #
  # MEASURED, and the delay is PER HTTP REQUEST, not per logical operation:
  # with `s3-latency 3` armed, `mc cat` of a 6-byte object took 9.034 s against
  # 0.022 s unarmed, because mc issues three requests to serve that one read.
  # Budget accordingly — a minio-go multipart Put is several requests.
  #
  # ALSO MEASURED, ON A LARGE PUT, because the fallthrough had real grounds to
  # be doubted: `proxy_request_buffering off` below means nginx cannot pass a
  # request to the next upstream once it has SENT any of the body, and the 6-byte
  # GET above proves nothing about that. It is sound because a CONNECT timeout
  # means nothing was sent yet. 64 MiB edge-artifact-large on bigbody+s3proxy:
  # upload_blob 0.753 s unarmed -> 9.702 s under `s3-latency 3` (controller
  # PUT .../artifacts 204, duration_ms 747 -> 9696), both Succeeded, both
  # objects in Garage. The access log shows 3 requests for that one Put
  # (POST ?uploads=, PUT ?partNumber=1, POST ?uploadId=), each ustatus="504, 200"
  # — black hole timed out, `backup` served it — and the body-bearing one
  # carries reqlen=67203925 and still falls through. So the arm WIDENS a large
  # Put, it does not break it. Evidence: w3-infra/step5-bigbody-and-latency-
  # recapture.txt, phase 3.
  upstream garage_delayed {
    server 192.0.2.1:3900 max_fails=0;
    server garage:3900 backup;
  }

  server {
    listen 3900;

    # See the W2-5 note above: this is what makes a reload deterministic
    # without killing in-flight transfers.
    keepalive_timeout 0;

    # SERVER level, deliberately, NOT location level. The latency arm sets its
    # own proxy_connect_timeout in an included file that lands inside
    # `location /`; nginx rejects a duplicate directive at the same level with
    # `[emerg] "proxy_connect_timeout" directive is duplicate` and refuses to
    # load, so the arm would silently never take. Declaring the default here
    # lets the arm's location-level value override it by normal inheritance.
    proxy_connect_timeout 2s;

    # Artifact and cache payloads are arbitrarily large and must stream, not
    # be spooled: buffering a PUT to disk would move the controller's Put
    # window (W3-6's TOCTOU width) and buffering a GET would collapse the
    # cache-restore stream W3-1 needs to hold open.
    #
    # CONSEQUENCE MEASURED BY W3-1, recorded here because it cost an arm:
    # `proxy_buffering off` also disables nginx's `limit_rate`, which is what
    # `inject.sh s3-slow` originally emitted — a 16909275-byte object went
    # through an armed proxy in `rt=0.060`, unthrottled, with the arm present
    # on that request line. The verb now emits `proxy_buffering on` +
    # `proxy_limit_rate` at LOCATION level instead, which both works and is
    # the semantically right knob for W3-1 (it throttles the read FROM Garage,
    # so the upstream GET stays genuinely in flight). The server-level `off`
    # below is still the default for the unarmed path and every other arm.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
      # $s3_sel is the single string every arm matches against, so one regex
      # can select on method AND key prefix at once (nginx `if` has no AND).
      # Shape: "<METHOD> /<bucket>/<key>", e.g. "PUT /unified-cd-logs/artifacts/<id>/app".
      set $s3_sel "$request_method $uri";
      set $s3_arm none;
      set $s3_target garage_up;

      # A wildcard include tolerates zero matching files, which is the unarmed
      # state. Arms are separate numbered files so a block arm and a latency
      # arm can be up at the same time (10-block.conf, 20-latency.conf,
      # 30-slow.conf); inject.sh s3-clear removes all of them.
      include /etc/nginx/s3fault/*.conf;

      # Echoed so a probe can confirm, from the response alone, which arm the
      # worker serving that connection had loaded. `always` so it is present on
      # an injected 5xx too — the if-block below inherits it.
      add_header X-S3-Arm $s3_arm always;

      # The variable in proxy_pass is what lets the latency arm reroute through
      # garage_delayed; $request_uri is appended verbatim so the path and the
      # SigV4-signed query string reach Garage byte-for-byte.
      proxy_pass http://$s3_target$request_uri;
      proxy_http_version 1.1;

      # LOAD-BEARING. SigV4 signs the Host header, and the client signed
      # "s3proxy:3900". nginx's default would rewrite it to the upstream name
      # and every request would fail SignatureDoesNotMatch.
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";

      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # proxy_connect_timeout is at server level (see the note there).
      # Only the latency arm's include adds proxy_next_upstream; the unarmed
      # path deliberately does NOT retry, so an injected failure is seen once.
    }

    # Arm confirmation. GET /_s3probe?m=<METHOD>&p=/<bucket>/<key> re-evaluates
    # the SAME include files against a caller-supplied (method, key) pair:
    #   200 + X-S3-Arm  => that pair is NOT blocked by the current arms
    #   5xx + X-S3-Arm  => that pair IS blocked (the arm's own `return` fired)
    # so one unauthenticated GET can confirm any method/prefix combination
    # without signing an S3 request. Reached with:
    #   docker compose $COMPOSE_FILES exec -T s3proxy \
    #     wget -S -q -O- 'http://127.0.0.1:3900/_s3probe?m=PUT&p=/unified-cd-logs/artifacts/x'
    location = /_s3probe {
      set $s3_sel "$arg_m $arg_p";
      set $s3_arm none;
      set $s3_target garage_up;
      include /etc/nginx/s3fault/*.conf;
      add_header X-S3-Arm $s3_arm always;
      default_type text/plain;
      return 200 "s3probe sel=[$s3_sel] arm=$s3_arm blocked=no\n";
    }
  }
}
