# W2-5 variant of nginx-edge.conf: adds an exact-match location for each
# agent's step-report endpoint (POST /api/v1/agents/<id>/steps) carrying its
# own runtime-writable include directory, so a single agent's step reports can
# be refused while every other agent API — crucially
# POST /api/v1/agents/<id>/runs/<runId>/children — keeps working.
# Armed with tools/inject.sh steplock <agent> / steplock-clear.
# Keep in sync with nginx-edge.conf and test/ha/nginx.conf.
events {}
http {
  upstream controllers {
    # max_fails/fail_timeout let nginx eject a dead controller from rotation quickly
    # after a failover kill, so subsequent requests skip it instead of retrying it.
    server controller1:8080 max_fails=1 fail_timeout=5s;
    server controller2:8080 max_fails=1 fail_timeout=5s;
    server controller3:8080 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 8080;

    # Exact-match locations take priority over the prefix location below, so a
    # request to agent1's step-report endpoint is evaluated here and nowhere
    # else. Both include directories are pulled in: the shared IP blocklist
    # (so `inject.sh nginx-block` keeps its whole-agent semantics on this path
    # too) and the per-agent step lock. Wildcard includes tolerate zero
    # matching files, which is the unarmed state.
    location = /api/v1/agents/agent1/steps {
      include /etc/nginx/blocklist/*.conf;
      include /etc/nginx/steplock/agent1/*.conf;
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }

    location = /api/v1/agents/agent2/steps {
      include /etc/nginx/blocklist/*.conf;
      include /etc/nginx/steplock/agent2/*.conf;
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }

    location / {
      include /etc/nginx/blocklist/*.conf;
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Short connect timeout so a SIGKILLed (dead) upstream fails fast and the request
      # is re-tried against a healthy controller — without this, a killed backend leaves
      # the connect hanging for the default 60s and clients time out during failover.
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Retry the next upstream on connect/response errors, and bound the total retries
      # and time so one request can traverse all three controllers within a few seconds.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }
  }
}
