# W6-2b variant of compose/nginx-logfault.conf.
#
# WHY A DERIVATIVE AND NOT AN EDIT. `nginx-logfault.conf` is W3-4's rig and
# W3-4 must stay reproducible, so it is left byte-for-byte alone. This file
# keeps everything W6's instruments depend on — most importantly the
# `logfault` log_format, VERBATIM, because tools/w6/w6-reqshape.sh parses that
# exact field order and `shape` exits 4 against any other format — and changes
# only what W6-2b's arms need and W3-4's arms do not:
#
#   1. `split_clients` on $request_id -> $w62b_split, so the flapping arm can
#      fail a per-request FRACTION rather than a time slice. A time-sliced
#      flap fully drains the backlog during each healthy slice, which is not
#      the stochastic-drain case Arm 3 is about. split_clients is an
#      http-level directive, so it cannot live in the runtime include and has
#      to be here.
#   2. `upstream hangsink` -> the logsink container, which accepts a TCP
#      connection and never writes to it. This is the black-hole arm: nginx
#      connects, forwards, and waits, so the agent's request is neither
#      answered nor refused and its own 60s client timeout (client.go:53) is
#      what ends it.
#   3. `upstream blackhole` (127.0.0.1:1, instant ECONNREFUSED) is kept from
#      nginx-logfault.conf but is used DIFFERENTLY here: W3-4 used it only as
#      the client-facing leg of a mirrored request, so the controller still
#      committed the batch. W6-2b uses it WITHOUT the mirror, which is the
#      whole point — the outage arms need a failure in which nothing reaches a
#      controller, or the resend curve becomes a duplicate-insert curve.
#   4. proxy_connect_timeout is NOT set in the bulk location. In
#      nginx-logfault.conf it is fixed at 2s there, which means an arm cannot
#      set its own without nginx failing `-t` on a duplicate directive. It is
#      set by the include instead; tools/w6/w6-2b-fault.sh writes it in EVERY
#      arm including `clear`, and the unarmed state falls back to nginx's 60s
#      default (documented here so nobody reads the absence as a hang).
#
# Armed with tools/w6/w6-2b-fault.sh. Keep in sync with test/ha/nginx.conf and
# compose/nginx-logfault.conf.
worker_shutdown_timeout 1s;
events {}
http {
  # VERBATIM from nginx-logfault.conf. w6-reqshape.sh's parser is keyed to this
  # exact field order; changing it silently breaks every W6 capture.
  log_format logfault '$msec $time_iso8601 $status arm=$logfault_arm '
                      'target=$logfault_target ustatus=$upstream_status '
                      'rt=$request_time urt=$upstream_response_time '
                      'reqlen=$request_length from=$remote_addr "$request"';
  access_log /dev/stdout logfault;

  upstream controllers {
    server controller1:8080 max_fails=1 fail_timeout=5s;
    server controller2:8080 max_fails=1 fail_timeout=5s;
    server controller3:8080 max_fails=1 fail_timeout=5s;
  }

  # Deliberately dead: 127.0.0.1:1 inside the nginx container refuses instantly,
  # so a request routed here fails fast and deterministically (502) having
  # reached no controller at all.
  upstream blackhole {
    server 127.0.0.1:1;
  }

  # Accepts the TCP connection and never writes a byte back. nginx therefore
  # sits in proxy_read_timeout (600s, set by the arm) and the agent sits in its
  # own 60s http.Client timeout. See compose/w62b.override.yaml for the sink.
  upstream hangsink {
    server logsink:8080;
  }

  # $request_id is a fresh 32-hex value per request, so this splits REQUESTS,
  # not clients, at the stated ratio. The flapping arm selects it by writing
  # `set $logfault_target $w62b_split;` into the include.
  split_clients "${request_id}" $w62b_split {
    50%     blackhole;
    *       controllers;
  }

  server {
    listen 8080;

    location ~ ^/api/v1/agents/[^/]+/runs/[^/]+/steps/[0-9]+/logs/bulk$ {
      set $logfault_arm none;
      set $logfault_target controllers;
      include /etc/nginx/logfault/*.conf;
      proxy_pass http://$logfault_target$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_send_timeout 300s;
      add_header X-Logfault-Arm $logfault_arm always;
    }

    location / {
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }
  }
}
