# W3-4 variant of test/ha/nginx.conf: gives the agent log-bulk endpoint
# (POST /api/v1/agents/<id>/runs/<runId>/steps/<n>/logs/bulk) its own
# regex location carrying a runtime-writable include directory, so that ONE
# endpoint can be faulted while claim / heartbeat / step-report / finish keep
# working. Armed with tools/w3/w3-4-logfault.sh.
#
# Two arms, both of which make the agent see a failure for a request the
# controller has already (wholly or partly) committed:
#
#   truncate  proxy_read_timeout is cut to a few hundred ms, so nginx gives up
#             on the upstream MID-LOOP and returns 504. Closing the upstream
#             connection cancels the controller's r.Context(), which aborts
#             handleAgentLogBulk's per-line loop
#             (internal/controller/api_agent.go:719-739) with the prefix
#             already autocommitted. => partial commit + lost ack.
#   lostack   the request is mirrored to a real controller (which commits the
#             WHOLE batch) while the client-facing proxy_pass is pointed at a
#             dead upstream, so the agent gets a 502. => full lost ack.
#             mirror runs in the PRECONTENT phase, strictly before the content
#             phase's proxy_pass, so the ordering is guaranteed by nginx's
#             phase engine and not by timing.
#
# worker_shutdown_timeout is the answer to the W2-5 lesson ("nginx -s reload is
# not guaranteed to take effect on an already-connected agent"): after a reload
# the OLD workers keep serving established keepalive connections with the OLD
# config. 1s forces them to close, so the agent's next flush opens a fresh
# connection against a new worker with the new config. It is a bound on the arm
# latency, not a guarantee — the access_log below is the empirical bracket.
#
# The custom access_log format IS the bracket: every armed/cleared claim in the
# runbook is made against the per-request status of the bulk URI, never against
# the wall-clock window in which the arm command was issued.
#
# Keep in sync with test/ha/nginx.conf and compose/nginx-edge.conf.
worker_shutdown_timeout 1s;
events {}
http {
  # $logfault_arm and $logfault_target are set in the bulk location below and
  # overridden by the armed include file; they are logged so the access log
  # states, per request, which arm was in force when nginx handled it.
  log_format logfault '$msec $time_iso8601 $status arm=$logfault_arm '
                      'target=$logfault_target ustatus=$upstream_status '
                      'rt=$request_time urt=$upstream_response_time '
                      'reqlen=$request_length from=$remote_addr "$request"';
  access_log /dev/stdout logfault;

  upstream controllers {
    # max_fails/fail_timeout let nginx eject a dead controller from rotation quickly
    # after a failover kill, so subsequent requests skip it instead of retrying it.
    server controller1:8080 max_fails=1 fail_timeout=5s;
    server controller2:8080 max_fails=1 fail_timeout=5s;
    server controller3:8080 max_fails=1 fail_timeout=5s;
  }

  # Deliberately dead: 127.0.0.1:1 inside the nginx container refuses instantly,
  # so the lostack arm's client-facing leg fails fast and deterministically
  # (502) with no timing dependency. Used ONLY by the lostack arm.
  upstream blackhole {
    server 127.0.0.1:1;
  }

  server {
    listen 8080;

    # Regex locations are evaluated before the prefix location below, so a bulk
    # log append is handled here and nowhere else. A wildcard include tolerates
    # zero matching files, which is the unarmed state — but note that the
    # unarmed state then also has no proxy_read_timeout/proxy_next_upstream of
    # its own and falls back to nginx defaults, which are NOT test/ha parity.
    # w3-4-logfault.sh clear writes those values back explicitly; the baseline
    # gate runs `clear` before measuring anything.
    location ~ ^/api/v1/agents/[^/]+/runs/[^/]+/steps/[0-9]+/logs/bulk$ {
      set $logfault_arm none;
      set $logfault_target controllers;
      include /etc/nginx/logfault/*.conf;
      proxy_pass http://$logfault_target$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_send_timeout 300s;
      # Echoed so a curl probe against this URI can confirm, from the response
      # alone, both that the regex location matched and which arm the worker
      # serving that connection has loaded.
      add_header X-Logfault-Arm $logfault_arm always;
    }

    # Mirror target for the lostack arm. Never reached directly (internal).
    location = /_logfault_mirror {
      internal;
      proxy_pass http://controllers$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }

    location / {
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Short connect timeout so a SIGKILLed (dead) upstream fails fast and the request
      # is re-tried against a healthy controller — without this, a killed backend leaves
      # the connect hanging for the default 60s and clients time out during failover.
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Retry the next upstream on connect/response errors, and bound the total retries
      # and time so one request can traverse all three controllers within a few seconds.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }
  }
}
