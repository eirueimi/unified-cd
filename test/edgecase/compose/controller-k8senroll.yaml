# W4-0 enrollment spike: controller config file for the HA compose rig.
#
# The HA rig configures its controllers with environment variables only, and
# `agentAuth` has NO environment-variable path — internal/config/controller.go
# reads kubernetesClusters/kubernetesEnrollmentPolicies from the YAML file and
# nowhere else ("Cluster credentials remain YAML-only", controller.go:277).
# Without a `-f` config file the verifier map is empty and every Kubernetes
# enrollment request is answered 503 "kubernetes identity unavailable"
# (internal/controller/api_agent_enrollment.go). Hence this file, mounted by
# k8senroll.override.yaml.
#
# LoadController decodes with KnownFields(true), so only fields declared on
# config.ControllerConfig may appear here. Everything else (DSN, S3, token,
# key file) keeps coming from the base rig's environment variables.
agentAuth:
  kubernetesClusters:
    # `kubeconfig` is a path INSIDE the controller container. The file is
    # generated by test/edgecase/k8s/make-spike-kubeconfig.sh and is gitignored
    # because it carries a live ServiceAccount bearer token.
    - name: w4-spike
      kubeconfig: /etc/unified-cd/kubeconfig.yaml
  kubernetesEnrollmentPolicies:
    # subjectConstraints are expressed as the namespaces/serviceAccounts pair;
    # ControllerKubernetesEnrollmentPolicyConfig.StorePolicy marshals them into
    # the policy row's SubjectConstraints JSON and hardcodes the agent ID
    # template "k8s:{cluster}:{namespace}:{podUID}".
    - name: w4-spike-policy
      cluster: w4-spike
      namespaces:
        - ci
      serviceAccounts:
        - w4-spike-agent
      allowedLabels:
        - kind:linux
        - w4:spike
      accessTokenTTL: 1h
      enabled: true
