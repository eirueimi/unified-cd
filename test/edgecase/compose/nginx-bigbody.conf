# W3 variant of test/ha/nginx.conf: lets an artifact upload larger than
# nginx's 1 MiB default body cap actually reach a controller.
#
# WHY THIS FILE EXISTS. `test/ha/nginx.conf` inherits nginx's default
# `client_max_body_size 1m`, so every artifact upload above ~1 MiB is rejected
# at the load balancer and never reaches a controller at all. Measured on the
# plain rig with a 64 MiB artifact, run 30e5a434 at 2026-07-31T02:33:28Z —
# quoted from w3-infra/step5-413-recapture.txt, not from memory:
#
#   nginx-1  [error] 30#30: *16 client intended to send too large chunked body:
#            1015835+32768 bytes, request: "PUT /api/v1/runs/<id>/artifacts/big-blob"
#   nginx-1  "PUT /api/v1/runs/<id>/artifacts/big-blob HTTP/1.1" 413 183
#   agent2-1 ERROR "upload-artifact failed" error="upload artifact http 413"
#   => step_reports: make_blob Succeeded / upload_blob Failed 0.015s /
#      after_upload Skipped; run Failed
#
# That is a filed finding (see FINDINGS.md) — a MINOR OBSERVATION, a docs gap:
# no user-facing doc names the knob anywhere. It is deliberately NOT filed as a
# violation of docs/high-availability.md:253-254's "a complete working example",
# because that phrase modifies "the reference settings" in a failover-tuning
# sentence whose section scopes LB tuning to the operator (:248-249) — the same
# reading the W3-4 entry already applied to the same sentence. This file is the
# campaign's way around the cap, not a fix — test/ha/nginx.conf is deliberately
# left as the documented reference configuration so the behaviour stays
# reproducible on the plain rig.
#
# Artifact traffic gets its own regex location, following the
# nginx-steplink.conf / nginx-logfault.conf idiom, so `location /` stays at
# byte parity with test/ha/nginx.conf and no other scenario's failover
# behaviour changes:
#
#   client_max_body_size 0      — no cap. Artifact size is bounded by the
#                                 fixture, not by the rig.
#   proxy_request_buffering off — LOAD-BEARING for W3-6. With buffering on
#                                 (the default) nginx spools the entire body
#                                 to disk before opening the upstream request,
#                                 which moves the controller's Put entirely
#                                 outside the wall-clock window in which the
#                                 agent is uploading — and W3-6's TOCTOU width
#                                 IS that Put. Off makes the proxy transparent
#                                 to the timing.
#   proxy_next_upstream off     — off DELIBERATELY, and the reason is narrower
#                                 than "nginx cannot replay an unbuffered
#                                 body". nginx refuses the next upstream only
#                                 once it has SENT part of such a body; on a
#                                 pure CONNECT failure nothing was sent and it
#                                 does fall through (measured on the S3
#                                 interposer, which relies on exactly that —
#                                 see nginx-s3.conf's garage_delayed note). It
#                                 is off here anyway because a retry that CAN
#                                 fire mid-upload would silently double a
#                                 64 MiB transfer and corrupt W3-6's timing,
#                                 and a half-sent body cannot be retried in any
#                                 case. Scoped to this location only.
#
# Keep in sync with test/ha/nginx.conf.
events {}
http {
  upstream controllers {
    # max_fails/fail_timeout let nginx eject a dead controller from rotation quickly
    # after a failover kill, so subsequent requests skip it instead of retrying it.
    server controller1:8080 max_fails=1 fail_timeout=5s;
    server controller2:8080 max_fails=1 fail_timeout=5s;
    server controller3:8080 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 8080;

    # PUT (upload) and GET (download) of a run artifact:
    # internal/controller/server.go:260, :496.
    location ~ ^/api/v1/runs/[^/]+/artifacts/ {
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream off;
    }

    location / {
      proxy_pass http://controllers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Short connect timeout so a SIGKILLed (dead) upstream fails fast and the request
      # is re-tried against a healthy controller — without this, a killed backend leaves
      # the connect hanging for the default 60s and clients time out during failover.
      proxy_connect_timeout 2s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Retry the next upstream on connect/response errors, and bound the total retries
      # and time so one request can traverse all three controllers within a few seconds.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 8s;
    }
  }
}
