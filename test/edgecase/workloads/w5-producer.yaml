apiVersion: unified-cd/v1
kind: Job
metadata:
  name: edge-w5-producer
spec:
  native: true
  agentSelector:
    - kind:linux
  steps:
    - name: make_marker
      run: |
        rm -rf out
        mkdir -p out
        printf 'W5-ARTIFACT-SOURCE=producer\nW5-NONCE=a1b2c3d4e5f60001\n' > out/marker.txt
        cat out/marker.txt
    - name: publish
      uploadArtifact:
        name: w5payload
        path: out
