# unified-cd production compose — runs the published container images.
#
# Unlike the repo-root docker-compose.yaml (which builds from source with air +
# Vite for hot reload), this stack pulls the release images from GHCR. The Web UI
# is baked into the controller image (UNIFIED_WEB_DIR=/ui), so no Vite service is
# needed.
#
# Nothing here has a built-in secret. Compose refuses to start until these are
# set (see deployments/docker/.env.example for how to generate each one):
#   UNIFIED_TOKEN, POSTGRES_PASSWORD, GARAGE_RPC_SECRET,
#   GARAGE_S3_ACCESS_KEY, GARAGE_S3_SECRET_KEY, UNIFIED_KEK_FILE
#
# Usage (run from the repository root so relative paths resolve):
#   cp deployments/docker/.env.example deployments/docker/.env   # fill in every value
#   unified-cli keygen --out deployments/docker/kek
#   docker compose -f deployments/docker/docker-compose.yaml up -d
#   docker compose -f deployments/docker/docker-compose.yaml logs -f controller
#
# Pin a release instead of :latest by setting UNIFIED_CD_VERSION in deployments/docker/.env, e.g.
#   UNIFIED_CD_VERSION=v0.0.3
#
# After startup:
#   Web UI: http://localhost:8080/ui/   (enter UNIFIED_TOKEN on the Connection card)
#   CLI:    export UNIFIED_SERVER=http://localhost:8080
#           export UNIFIED_TOKEN=<your token>
#           unified-cli apply -f examples/jobs/hello.yaml
#
# The controller publishes 8080 on all interfaces and speaks plain HTTP. Put a
# TLS-terminating reverse proxy in front of it and, if the proxy runs on this
# host, publish 127.0.0.1:8080:8080 instead of 8080:8080 below.

services:

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    # This limit covers the isolated controller pools with operational
    # headroom. Configure the equivalent limit on an external PostgreSQL
    # service before pointing UNIFIED_DB_DSN at it.
    command: [ "postgres", "-c", "max_connections=1000" ]
    environment:
      POSTGRES_USER: unified
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (use hex only, e.g. openssl rand -hex 24)}
      POSTGRES_DB: unified
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U unified" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- Garage (S3-compatible object store for log archives & artifacts) ----
  # Replace with real S3 by pointing the controller's UNIFIED_S3_* at your bucket
  # and removing this service.
  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env (64 hex chars, openssl rand -hex 32)}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_S3_ACCESS_KEY:?set GARAGE_S3_ACCESS_KEY in .env (openssl rand -hex 12)}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_S3_SECRET_KEY:?set GARAGE_S3_SECRET_KEY in .env (openssl rand -hex 32)}
      GARAGE_DEFAULT_BUCKET: unified-cd-logs
    volumes:
      - garagedata:/data
      - ../garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---- Controller (published image; Web UI baked in) ----
  # A local build fallback is declared so `docker compose up --build` (or a first
  # `up` when no image is published yet) produces the alpine-based controller the
  # healthcheck below expects. Once release-docker.yml publishes a matching
  # unified-cd-controller image, `docker compose pull` fetches it instead.
  controller:
    image: ghcr.io/eirueimi/unified-cd-controller:${UNIFIED_CD_VERSION:-latest}
    build:
      context: ../../
      dockerfile: docker/controller.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      UNIFIED_DB_DSN: postgres://unified:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/unified?sslmode=disable
      UNIFIED_DB_API_MAX_CONNS: "${UNIFIED_DB_API_MAX_CONNS:-128}"
      UNIFIED_DB_BACKGROUND_MAX_CONNS: "${UNIFIED_DB_BACKGROUND_MAX_CONNS:-32}"
      UNIFIED_DB_LOCK_MAX_CONNS: "${UNIFIED_DB_LOCK_MAX_CONNS:-16}"
      UNIFIED_DB_LISTEN_MAX_CONNS: "${UNIFIED_DB_LISTEN_MAX_CONNS:-128}"
      UNIFIED_TOKEN: ${UNIFIED_TOKEN:?set UNIFIED_TOKEN in .env (openssl rand -hex 32)}
      # Dev mode is off: it would use an ephemeral in-memory key, so every
      # stored secret would be lost on restart. The persistent key comes from
      # the `kek` file secret below (generate it with `unified-cli keygen`).
      UNIFIED_CONTROLLER_KEY_FILE: /run/secrets/kek
      UNIFIED_S3_ENDPOINT: garage:3900
      UNIFIED_S3_BUCKET: unified-cd-logs
      UNIFIED_S3_KEY: ${GARAGE_S3_ACCESS_KEY:?set GARAGE_S3_ACCESS_KEY in .env}
      UNIFIED_S3_SECRET: ${GARAGE_S3_SECRET_KEY:?set GARAGE_S3_SECRET_KEY in .env}
      UNIFIED_OIDC_ISSUER: ${UNIFIED_OIDC_ISSUER:-}
      UNIFIED_OIDC_CLIENT_ID: ${UNIFIED_OIDC_CLIENT_ID:-}
      UNIFIED_OIDC_CLIENT_SECRET: ${UNIFIED_OIDC_CLIENT_SECRET:-}
    secrets:
      - kek
    ports:
      - "8080:8080"
    # The controller image is alpine-based (it needs the git CLI for AppSource
    # reconciliation), so busybox wget is available for a container healthcheck.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- agent enrollment (one-shot bootstrap) ----
  # Issues the agent a one-time enrollment token so it can bootstrap its own
  # persistent, per-agent, revocable credential file (kept in the
  # agent-credentials volume) instead of a shared runtime token. Builds from
  # source (dev.Dockerfile, which has the Go toolchain) solely to run
  # `unified-cli agent enrollment create` — the published controller/agent
  # images don't bundle the CLI.
  #
  # Idempotent across `docker compose up` re-runs:
  #   - if the agent's persisted credential file already exists (a prior
  #     enrollment succeeded), this exits immediately without creating a new
  #     enrollment token or contacting the controller.
  #   - otherwise it removes any stale/unconsumed enrollment-token file
  #     first, because `agent enrollment create --output-file` creates that
  #     file exclusively and errors if one is already there.
  agent-enroll:
    build:
      context: ../../
      dockerfile: docker/dev.Dockerfile
    volumes:
      - ../../:/app
      - agent-credentials:/var/lib/unified-cd-agent
    depends_on:
      controller:
        condition: service_healthy
    environment:
      UNIFIED_SERVER: http://controller:8080
      UNIFIED_TOKEN: ${UNIFIED_TOKEN:?set UNIFIED_TOKEN in .env}
    command:
      - sh
      - -c
      - |
        set -e
        CRED=/var/lib/unified-cd-agent/credentials.json
        ENROLL=/var/lib/unified-cd-agent/enrollment.token
        if [ -f "$$CRED" ]; then
          echo "agent-enroll: credential file already present, skipping enrollment"
          exit 0
        fi
        rm -f "$$ENROLL"
        go run -buildvcs=false ./cmd/unified-cli agent enrollment create \
          --agent-id ${UNIFIED_AGENT_ID:-docker-agent-1} \
          --label kind:docker --label pool:default \
          --expires-in 10m \
          --output-file "$$ENROLL"
        echo "agent-enroll: wrote enrollment token to $$ENROLL"
    restart: "no"

  # ---- Agent (Linux/Docker worker) ----
  # No agent image is published to GHCR yet, so this is built locally from the
  # same Dockerfile the release workflow would use. Once release-docker.yml
  # publishes unified-cd-agent, `docker compose pull` will fetch it instead.
  agent:
    image: ghcr.io/eirueimi/unified-cd-agent:${UNIFIED_CD_VERSION:-latest}
    build:
      context: ../../
      dockerfile: docker/agent.Dockerfile
    # The controller now has a healthcheck, so wait for it to be healthy. The
    # agent also registers via retry-with-backoff, so it tolerates restarts.
    depends_on:
      controller:
        condition: service_healthy
      dind:
        condition: service_healthy
      agent-enroll:
        condition: service_completed_successfully
    environment:
      UNIFIED_SERVER: http://controller:8080
      # The controller is reached over the compose network, not TLS: opt in to http.
      UNIFIED_ALLOW_INSECURE_HTTP: "true"
      UNIFIED_AGENT_CREDENTIAL_FILE: /var/lib/unified-cd-agent/credentials.json
      UNIFIED_AGENT_ENROLLMENT_TOKEN_FILE: /var/lib/unified-cd-agent/enrollment.token
      UNIFIED_AGENT_ID: ${UNIFIED_AGENT_ID:-docker-agent-1}
      UNIFIED_AGENT_LABELS: ${UNIFIED_AGENT_LABELS:-kind:docker,pool:default}
      # The dind daemon requires mutual TLS: the client certificate comes from
      # the read-only dind-client-certs volume that dind generates on first start.
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # Step environments are an allowlist: a native step no longer inherits
      # the agent process env, so the Docker variables must be named here or
      # `docker` in a step falls back to the unix socket (which does not exist
      # here) and fails.
      UNIFIED_AGENT_EXPOSE_ENV: DOCKER_HOST,DOCKER_TLS_VERIFY,DOCKER_CERT_PATH
      UNIFIED_AGENT_WORKSPACE_DIR: /ucd-workspaces
    volumes:
      - ucd-workspaces:/ucd-workspaces
      - agent-credentials:/var/lib/unified-cd-agent
      - dind-client-certs:/certs/client:ro
    restart: unless-stopped

  # ---- Docker-in-Docker (container runtime for isolated jobs) ----
  # The agent runs isolated (non-native) jobs by shelling out to `docker`, which
  # talks to this daemon via DOCKER_HOST. Job containers live inside dind. The
  # ucd-workspaces volume is mounted at the SAME path here and in the agent so
  # bind mounts resolved by this daemon see the agent's workspace files.
  #
  # The daemon listens on 2376 with mutual TLS only (never plain 2375), and
  # no port is published to the host: only containers on this compose network
  # can reach it, and only with a client certificate from the dind-client-certs volume
  # (mounted read-only into the agent). `privileged: true` is required by
  # Docker-in-Docker itself; anything that can talk to this daemon can take over
  # the dind container, so keep it off the host network and unpublished.
  dind:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      # The server certificate must name the host the agent dials.
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - ucd-workspaces:/ucd-workspaces
      - dind-storage:/var/lib/docker
      - dind-certs:/certs
      - dind-client-certs:/certs/client
    healthcheck:
      test: [ "CMD", "docker", "info" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  garagedata:
  ucd-workspaces:
  dind-storage:
  dind-certs:
  dind-client-certs:
  agent-credentials:

secrets:
  # 64-hex-char secret-encryption key (KEK). Create it once with
  # `unified-cli keygen --out deployments/docker/kek` and back it up: losing it
  # makes every stored secret unreadable. Path is relative to this file unless
  # UNIFIED_KEK_FILE is absolute.
  kek:
    file: ${UNIFIED_KEK_FILE:?set UNIFIED_KEK_FILE in .env (path to the file written by unified-cli keygen)}
